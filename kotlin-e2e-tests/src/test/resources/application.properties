# H27-37 — Quarkus test config for the E2E module.
# The application classes live in the kotlin-invoice dependency; Quarkus only
# indexes the local module by default, so the dependency must be indexed
# explicitly or its entities stay outside the persistence unit.
quarkus.index-dependency.invoice.group-id=de.littletrotter
quarkus.index-dependency.invoice.artifact-id=kotlin-invoice
quarkus.index-dependency.shared.group-id=de.littletrotter
quarkus.index-dependency.shared.artifact-id=kotlin-shared

# Schema comes from the app's Flyway migrations (packaged in the dependency).
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration/ddl,db/migration/seed
quarkus.hibernate-orm.database.generation=none

# Datasource URL/credentials are injected by PostgresTestResource — as JVM system properties
# (System.setProperty), not just the returned config map, since a cross-module @QuarkusTest that
# indexes kotlin-invoice as a dependency also carries kotlin-invoice's own application.properties
# (with its own literal defaults) on this module's classpath; see PostgresTestResource's own KDoc
# for the full diagnosis of why the plain config-source map alone was not enough here.

# Cross-module Quarkus tests: avoid the split classloader (kotlin-shared/stdlib
# otherwise load parent-first and clash with augmented classes).
quarkus.test.flat-class-path=true

# ST-1 — the 100-thread stress harness (ConcurrentCrudStressE2EIT) needs a pool big enough that
# waiting for a JDBC connection isn't the bottleneck; the Agroal default (20) would starve most
# workers on connection acquisition alone, well below any real domain race. Capped at 80, not 100+,
# to stay under Postgres's own default max_connections (100, PostgresTestResource's plain
# postgres:18 image) once the few reserved/superuser slots are accounted for. Harmless for
# every other IT in this module.
quarkus.datasource.jdbc.min-size=10
quarkus.datasource.jdbc.max-size=80
quarkus.datasource.jdbc.acquisition-timeout=30S
