# German label set for the Typst invoice template.
#
# Localization keys keyed by the invoice's document language.
#
# Rules:
#   - Every key exists in BOTH invoice-labels_de.properties and invoice-labels_en.properties.
#     A missing key is a defect, not a fallback (see R3-T04).
#   - Casing is part of the value. Do not uppercase in code — locale-dependent uppercasing
#     is a trap, and only the bundle knows whether a language wants an all-caps heading.
#   - {0}/{1} are MessageFormat placeholders; the argument order is fixed per key.
#   - Read with an explicit UTF-8 reader (Java's ISO-8859-1 default for
#     PropertyResourceBundle applies below Java 9 and to some tooling).

# ── Betreff / Titel ──
subject.prefix=Rechnung Nr.
subject.prefix.creditNote=Stornorechnung Nr.
info.originalInvoiceNo=Storno zu Rechnung
info.originalInvoiceDate=Original vom

# ── Rechnungs-Infobox ──
info.invoiceNo=Rechnungs-Nr.
info.invoiceDate=Rechnungsdatum
info.offerNo=Angebots-Nr.
info.offerDate=Angebotsdatum
info.servicePeriod=Leistungszeitraum
info.customerNo=Kunden-Nr.
info.orderNo=Auftrags-Nr.
info.dueDate=Zahlungsziel
info.buyerReference=Käuferreferenz
info.purchaseOrderReference=Bestellreferenz
info.projectNumber=Projektreferenz

# ── Anbieter-Infobox ──
sender.vatId=USt-ID
sender.taxNumber=St.-Nr.
sender.email=E-Mail
sender.phone=Telefon

# ── Positionstabelle ──
table.pos=Pos.
table.description=Bezeichnung
table.quantity=Menge
table.unitPrice=Einzelpreis
table.netAmount=Nettobetrag
table.taxAmount=USt.-Betrag
table.tax=USt.

# ── Steueraufschlüsselung ──
breakdown.rate=USt.-Satz
breakdown.net=Netto
breakdown.vat=USt.

# ── Summenblock ──
total.net=Nettobetrag
total.vat=zzgl. Umsatzsteuer
# PO-Anforderung — bei genau einem Steuersatz nennt das Label den Satz, statt generisch zu
# bleiben (InvoiceReportModelBuilder.vatTotalLabel); {0} = bereits formatierter Satz, z. B. "19 %".
total.vat.withRate=zzgl. {0} Umsatzsteuer
total.gross=Rechnungsbetrag

# ── Zahlungsblock ──
payment.title=ZAHLUNGSBEDINGUNGEN
payment.amount=Rechnungsbetrag
payment.due=Zahlungsziel
payment.bank=Bankname
payment.reference=Verwendungszweck
payment.hint.noBankDetails=Bitte kontaktieren Sie uns für unsere Bankverbindung.
payment.due.byDate=Zahlbar bis {0}
payment.due.withinDays=Zahlbar innerhalb {0} Tagen netto
payment.due.immediately=Zahlbar sofort
payment.qr=Mit GiroCode zahlen

# ── Hinweisblöcke ──
note.title=HINWEIS
taxnote.title=STEUERHINWEIS
# IN-6 — Pflichtangabe nach § 14 Abs. 4 Nr. 10 UStG. Der Wortlaut muss mit dem
# Befreiungsgrundtext (BT-120) der Steuerregel im XML übereinstimmen — R1 liefert ihn
# aus der Steuerregel, diese Werte sind nur der Rückfall, wenn die Regel keinen Text führt
# (composeTaxNote's ifBlank-Zweig). Lookup-Reihenfolge dort: VATEX-Code vor Kategorie.
# taxnote.standard.AE/E/O sind Kategorie-Rückfälle ohne Code; taxnote.standard.VATEX-*
# sind code-spezifisch und gewinnen. Kategorie S hat bewusst keinen Schlüssel — keine
# Ausnahme, kein Hinweis.
taxnote.standard.AE=Steuerschuldnerschaft des Leistungsempfängers (Reverse Charge).
taxnote.standard.E=Steuerbefreite Leistung.
taxnote.standard.O=Nicht steuerbarer Umsatz (Leistungsort im Ausland).
taxnote.standard.VATEX-EU-AE=Steuerschuldnerschaft des Leistungsempfängers (Reverse Charge).

# ── Fußzeile ──
footer.jurisdiction=Gerichtsstand:
footer.registerCourt=Registergericht:
footer.managingDirector=GF.
# PO-Vorgabe — Fußzeile Spalte 1 (Kontakt): "Sitz: <Sitz>" nur bei vorhandener
# Handelsregisternummer; "Tel. <Telefon>"; E-Mail/Website unbeschriftet.
footer.seat=Sitz:
footer.phone=Tel.
sender.website=Website
page.prefix=Seite

# ── B2B-Felder im PDF: Artikel-Bezeichner ──
# Positionstabelle, beide Tabellenvarianten gleich (keine eigenen Artikelnummer-Spalten mehr): bis
# zu drei kleingedruckte Zeilen unter der Positionsbezeichnung, vor einem etwaigen BT-154-Text:
#   Zeile 1 — die eigene Artikelnummer, unbeschriftet (BT-155, Fallback System-Artikelnummer);
#     der bloße Wert ist in dieser Zeile selbsterklärend.
#   Zeile 2 — item.buyerId: "Ref. <Wert>" (ohne Doppelpunkt, ein Leerzeichen vor dem Wert), BT-156
#     (Artikelnummer des Kunden); entfällt, wenn BT-156 gleich BT-155 ist (nichts Neues für den
#     Kunden, seine Nummer ist die des Verkäufers).
#   Zeile 3 — die kundenspezifische Artikelbezeichnung, kursiv, eigene Zeile; nur zusammen mit
#     Zeile 2 (eine Bezeichnung ohne Kundenartikelnummer hat nichts, das sie beschreiben könnte).
# BT-157 (Artikel-Kennung) bleibt im Export-XML erfasst, bekommt aber keine gedruckte Zeile.
item.buyerId=Ref.
table.unit=Einheit
table.servicePeriod=Datum
# lfm ist die einzige nicht-SI-Einheit, die die Rechnung als Kurzsymbol druckt (Handwerker-Konvention
# "laufender Meter"); alle anderen gedruckten Einheitensymbole sind SI und brauchen keine Erklärung.
table.unitFootnote.lfm=lfm = laufender Meter

# ── RK-4 — Dienstreise-Position (eine BG-25-Zeile je Reise, P-RK-4/P-RK-5) ──
# Zweite kleingedruckte Zeile unter der Positionsbezeichnung: Zweck (BT-154) und Reisezeitraum
# (BG-26), dritte Zeile der Gesamtbetrag der Position (Unterzeile, keine neue Spalte). PO
# 13.09.2026: nie "Netto"/"Brutto" auf einer Positions-Unterzeile — verwirrt mit der
# Rechnungssumme.
subline.purpose=Zweck
subline.period=Datum
# Detailliert (P-RK-5): eingerückte Unterzeilen "3.1, 3.2 …" je Posten, plus eine Summenzeile für
# die Verpflegungspauschalen. Kind-Labels teilen sich diese Bundle-Datei mit dem BT-127-Zeilenhinweis
# (MustangExportModelMapper.buildTripLineNote) — ein Wortlaut für PDF und XML.
trip.kind.hotel=Unterkunft
trip.kind.transport=Fahrkarten
trip.kind.mileage=Kilometer
trip.kind.other=Sonstiges
trip.kind.travelTime=Reisezeit
trip.perDiem=Verpflegungspauschalen
trip.days=Tage
