# English label set for the Typst invoice template.
#
# See invoice-labels_de.properties for rules governing both files.
#
# The English set is the international variant used for recipients outside Germany. It is
# NOT the "reverse charge variant": a French consumer (no reverse charge) gets this set,
# and a domestic reverse-charge case would still get the German one.

# ── Subject / title ──
subject.prefix=Invoice No.
subject.prefix.creditNote=Credit note No.
info.originalInvoiceNo=Reversal of invoice
info.originalInvoiceDate=Original dated

# ── Invoice info box ──
info.invoiceNo=Invoice No.
info.invoiceDate=Invoice Date
info.offerNo=Offer No.
info.offerDate=Offer Date
info.servicePeriod=Service Period
info.customerNo=Customer No.
info.orderNo=Order No.
info.dueDate=Due Date
info.buyerReference=Buyer Reference
info.purchaseOrderReference=Purchase Order Ref.
info.projectNumber=Project Reference

# ── Supplier info box ──
sender.vatId=VAT ID
sender.taxNumber=Tax Number
sender.email=E-Mail
sender.phone=Phone

# ── Line item table ──
table.pos=Item
table.description=Description
table.quantity=Quantity
table.unitPrice=Unit Price
table.netAmount=Net Amount
table.taxAmount=Tax Amount
table.tax=Tax

# ── Tax breakdown ──
breakdown.rate=Tax Rate
breakdown.net=Net
breakdown.vat=VAT

# ── Totals ──
total.net=Net Amount
total.vat=plus VAT
# PO requirement — when exactly one tax rate applies, the label names it instead of staying
# generic (InvoiceReportModelBuilder.vatTotalLabel); {0} = the already-formatted rate, e.g. "19 %".
total.vat.withRate=plus {0} VAT
total.gross=Total Amount

# ── Payment block ──
payment.title=PAYMENT TERMS
payment.amount=Total Amount
payment.due=Due Date
payment.bank=Bank Name
payment.reference=Reference
payment.hint.noBankDetails=Please contact us for our bank details.
payment.due.byDate=Payable by {0}
payment.due.withinDays=Payable within {0} days net
payment.due.immediately=Payable immediately
payment.qr=GiroCode – scan to pay

# ── Notes ──
note.title=NOTE
taxnote.title=TAX NOTE
# IN-6 — the short, derived standard sentence added alongside the (untranslated) German
# exemption text on an English document (composeTaxNote), and the German-fallback family's
# English half. Never a user's translation: derived only from the UNTDID 5305 tax category
# and the VATEX code (BT-121). Lookup order: VATEX code before category; taxnote.standard.AE/
# E/O are category fallbacks without a code, taxnote.standard.VATEX-* are code-specific and
# win. Category S has deliberately no key — no exemption, no note.
taxnote.standard.AE=Reverse charge: the recipient of the service is liable for VAT.
taxnote.standard.E=Tax exempt supply.
taxnote.standard.O=Not subject to VAT (place of supply outside Germany).
taxnote.standard.VATEX-EU-AE=Reverse charge: the recipient is liable for VAT (Art. 196 VAT Directive).

# ── Footer ──
footer.jurisdiction=Jurisdiction:
footer.registerCourt=Register court:
footer.managingDirector=MD
# Footer column 1 (contact): "Registered office: <seat>" only when a commercial register
# number exists; "Phone <phone>"; email/website unlabeled.
footer.seat=Registered office:
footer.phone=Phone
sender.website=Website
page.prefix=Page

# ── B2B fields on the PDF: article identifiers ──
# Line item table, both table variants alike (neither carries its own article-number columns any
# more): up to three small-print lines under the item description, ahead of any BT-154 text:
#   Line 1 — the seller's own item number, unlabelled (BT-155, falling back to the system
#     article number); the bare value is self-explanatory in that line.
#   Line 2 — item.buyerId: "Ref. <value>" (no colon, one space before the value), BT-156 (the
#     buyer's item number); omitted when BT-156 equals BT-155 (nothing new for the buyer, their
#     number is the seller's own).
#   Line 3 — the recipient-specific article description, italic, its own line; only together
#     with line 2 (a description with no buyer item number has nothing left to describe).
# BT-157 (item standard identifier) stays captured for the export XML but never gets a printed
# line.
item.buyerId=Ref.
table.unit=Unit
table.servicePeriod=Date
# lfm is the only non-SI unit this invoice prints as a symbol (the German trade convention
# "laufender Meter"); every other printed unit symbol is SI and needs no explanation.
table.unitFootnote.lfm=lfm = linear metre

# ── RK-4 — business trip position (one BG-25 line per trip, P-RK-4/P-RK-5) ──
# Second small-print line under the item description: purpose (BT-154) and trip period (BG-26),
# third line the position's total (a subline, not a new column). PO 13.09.2026: never
# "Net"/"Gross" on a position subline -- confuses with the invoice total.
subline.purpose=Purpose
subline.period=Date
# Detailed (P-RK-5): indented "3.1, 3.2 …" sub-rows per expense, plus one summary row for the
# per-diem allowances. Kind labels are shared with the BT-127 line note
# (MustangExportModelMapper.buildTripLineNote) — one wording for the PDF and the XML.
trip.kind.hotel=Accommodation
trip.kind.transport=Travel tickets
trip.kind.mileage=Mileage
trip.kind.other=Other
trip.kind.travelTime=Travel time
trip.perDiem=Per diem allowances
trip.days=days
