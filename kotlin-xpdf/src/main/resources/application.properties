quarkus.http.port=8081
quarkus.smallrye-health.root-path=/health
quarkus.log.console.json=true

# NATS JetStream
nats.url=${NATS_URL:nats://localhost:4222}
nats.subject.document-jobs=document-jobs
nats.subject.document-jobs-interactive=document-jobs-interactive
nats.subject.document-job-results=document-job-results
nats.subject.document-jobs-dlq=document-jobs-dlq
nats.subject.document-job-results-dlq=document-job-results-dlq
nats.consumer.document-jobs=kotlin-xpdf-group

# Job retry/backoff
job.retry.count=3
job.retry.backoff.ms=1000

# S3-compatible object store (RustFS)
s3.endpoint=${S3_ENDPOINT:http://rustfs:9000}
s3.access-key=${S3_ACCESS_KEY:rustfsadmin}
s3.secret-key=${S3_SECRET_KEY:rustfsadmin}
s3.bucket=${S3_BUCKET:documents}
# ARC-3 §2 — fail-fast instead of fail-open, same as kotlin-invoice's application.properties: no
# %prod fallback, so a deployment missing S3_ACCESS_KEY/S3_SECRET_KEY refuses to start instead of
# silently using the dev RustFS default credentials against a real object store.
%prod.s3.access-key=${S3_ACCESS_KEY}
%prod.s3.secret-key=${S3_SECRET_KEY}


# RS-9 — Ed25519 signing key for the archive package (ArchiveSigningKeyProvider). Two base64
# secrets (private/public, PKCS8/X.509 DER — see Ed25519Keys), generated together by the lt-setup
# wizard. ARC-3 §2 fail-fast, same as S3_ACCESS_KEY/S3_SECRET_KEY above: no %prod fallback, so a
# deployment missing either env var refuses to start instead of silently signing packages with a
# dev/ephemeral key. Blank in dev/test is deliberate (ArchiveSigningKeyProvider generates an
# ephemeral keypair) — see that class's own KDoc.
xpdf.archive.signing-private-key=${ARCHIVE_ED25519_PRIVATE_KEY:}
xpdf.archive.signing-public-key=${ARCHIVE_ED25519_PUBLIC_KEY:}
%prod.xpdf.archive.signing-private-key=${ARCHIVE_ED25519_PRIVATE_KEY}
%prod.xpdf.archive.signing-public-key=${ARCHIVE_ED25519_PUBLIC_KEY}

# Optional demo watermark text stamped on every generated PDF, e.g. "Little Trotter · Demo"
# (PdfWatermarkStamper). Deliberately not set here: unset means no watermark. Set it through the
# environment as LITTLETROTTER_PDF_WATERMARK_TEXT (littletrotter.pdf.watermark.text).

# Auflösung, in der Belegseiten für das Kombi-Dokument gerastert werden.
xpdf.receipt-annex.dpi=${RECEIPT_ANNEX_DPI:150}
xpdf.receipt-annex.jpeg-quality=${RECEIPT_ANNEX_JPEG_QUALITY:0.75}
# Obergrenze der Pixel je gerasterter Belegseite; senkt die Auflösung, verweigert nie.
xpdf.receipt-annex.max-pixels=${RECEIPT_ANNEX_MAX_PIXELS:4500000}

# Ab dieser Größe legt PDFBox Zwischendaten eines Dokuments in Temp-Dateien statt in den Heap.
xpdf.pdfbox.memory-threshold-bytes=${PDFBOX_MEMORY_THRESHOLD_BYTES:8388608}

# Byte-Budget (KiB) der gleichzeitig laufenden Druckjobs; ein Job wartet, bis sein Gewicht frei ist.
# xpdf.job-weight-budget-kib / XPDF_JOB_WEIGHT_BUDGET_KIB is optional: unset, JobWeightBudgetProducer derives it from the heap headroom (RenderSizing).

# Export stage/job timers (ExportStageTimers) and the JVM heap/GC gauges are scraped from
# /q/metrics; stated explicitly so a dependency or default change cannot silently drop them.
quarkus.micrometer.enabled=true
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.export.prometheus.enabled=true
