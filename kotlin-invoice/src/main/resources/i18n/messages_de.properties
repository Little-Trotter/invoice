invoiceExport.cover.closing=Dieser Hinweis ist eine allgemeine Orientierung, keine Rechtsberatung; über die konkrete Handhabung entscheidet der Datenschutzbeauftragte des Unternehmens.
invoiceExport.notes.1.label=Inhalt
invoiceExport.notes.1.text=Diese Arbeitsmappe enthält die Blätter Rechnungen, Positionen und Protokoll für diese Rechnung; die Datensatzzahlen oben gelten je Blatt.
invoiceExport.notes.1.text.modeB=Diese Arbeitsmappe enthält die Blätter Rechnungen und Positionen für die gefilterte Auswahl; die Datensatzzahlen oben gelten je Blatt.
invoiceExport.notes.2.label=Momentaufnahme
invoiceExport.notes.2.text=Diese Datei ist eine Kopie zum Erzeugungszeitpunkt; spätere Änderungen in der Anwendung sind nicht enthalten. Sie ist kein Rechnungsdokument — rechtlich maßgeblich sind die in der Anwendung archivierten E-Rechnungen (XML/PDF).
invoiceExport.notes.3.label=Kontrollspalten
invoiceExport.notes.3.text=Die Spalten „Prüfung" und „Δ" werden beim Öffnen von Excel selbst neu berechnet; eine Abweichung ≠ 0 ist ein Befund, der in der Anwendung zu prüfen ist, nicht in der Datei zu korrigieren.
invoiceExport.notes.4.label=Beträge und Formate
invoiceExport.notes.4.text=Beträge stehen in der Rechnungswährung (das Zahlenformat zeigt den ISO-Code), Mengen mit vier Nachkommastellen, Steuersätze als reine Zahl (19 = 19 %), Datumsangaben im Format TT.MM.JJJJ.
invoiceExport.notes.5.label=Grenzen
invoiceExport.notes.5.text=Zeilen je Blatt und Zeichenlänge je Zelle sind begrenzt (siehe XLS-1); ein gekürzter Text endet mit „…[gekürzt]".
invoiceExport.notes.6.label=Storno
invoiceExport.notes.6.text=Ein Stornodokument (Typ 384) erscheint als eigene Zeile mit negativen Beträgen und verweist auf sein Ursprungsdokument.
invoiceExport.privacy.1.article=Art. 4 Nr. 1 DSGVO
invoiceExport.privacy.1.text=Dieser Auszug enthält personenbezogene Daten (Namen, Anschriften, E-Mail-Adressen, USt-IdNrn. und Bankverbindungen von Kontakt- und Unterschriftspersonen).
invoiceExport.privacy.2.article=Art. 4 Nr. 7 DSGVO
invoiceExport.privacy.2.text=Verantwortlicher ist das betreibende Unternehmen; wer die Datei weitergibt, bleibt für sie verantwortlich.
invoiceExport.privacy.3.article=Art. 5 Abs. 1 lit. b, c, e, f DSGVO
invoiceExport.privacy.3.text=Zweckbindung, Datenminimierung, Speicherbegrenzung, Integrität und Vertraulichkeit: Die Datei ist nur für den Zweck zu verwenden, für den sie erzeugt wurde, nach Zweckerfüllung zu löschen und zugriffsbeschränkt aufzubewahren.
invoiceExport.privacy.4.article=Art. 6 Abs. 1 lit. b und c DSGVO
invoiceExport.privacy.4.text=Rechtsgrundlage sind Vertragserfüllung sowie rechtliche Verpflichtungen (umsatzsteuerliche Rechnungspflichten und gesetzliche Aufbewahrungspflichten); für jeden weiteren Zweck ist eine eigene Rechtsgrundlage erforderlich.
invoiceExport.privacy.5.article=Art. 28 DSGVO
invoiceExport.privacy.5.text=Die Weitergabe der Datei an einen Dienstleister erfordert einen Auftragsverarbeitungsvertrag.
invoiceExport.privacy.6.article=Art. 32 DSGVO
invoiceExport.privacy.6.text=Sicherheit der Verarbeitung: verschlüsselt oder zugriffsbeschränkt speichern, nie unverschlüsselt per E-Mail versenden, nie auf Freigaben ohne Zugriffskontrolle ablegen.
invoiceExport.privacy.7.article=Art. 17 DSGVO
invoiceExport.privacy.7.text=Löschung: Die Datei ist eine Kopie und unterliegt nicht der Aufbewahrungspflicht; die Originale verbleiben wegen der gesetzlichen Aufbewahrungspflicht in der Anwendung. Die Kopie ist nach Gebrauch zu löschen.

