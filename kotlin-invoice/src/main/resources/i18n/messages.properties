invoiceExport.cover.subtitlePattern=Invoice data export — {0}
invoiceExport.cover.section.export=Export
invoiceExport.cover.section.notes=Export notes
invoiceExport.cover.section.privacy=Data protection (GDPR)
invoiceExport.cover.closing=This notice is general guidance, not legal advice; the company's data protection officer decides the concrete handling.
invoiceExport.notes.1.label=Contents
invoiceExport.notes.1.text=This workbook contains the sheets Invoices, Positions and Log for this invoice; the record counts above apply per sheet.
invoiceExport.notes.1.text.modeB=This workbook contains the sheets Invoices and Positions for the filtered selection; the record counts above apply per sheet.
invoiceExport.notes.2.label=Snapshot
invoiceExport.notes.2.text=This file is a copy taken at generation time; changes made in the application afterwards are not reflected. It is not an invoice document — the legally relevant documents are the e-invoices (XML/PDF) archived in the application.
invoiceExport.notes.3.label=Control columns
invoiceExport.notes.3.text=The "Verdict" and "Δ" columns recompute when Excel opens the file; a deviation ≠ 0 is a finding to check in the application, not to correct in the file.
invoiceExport.notes.4.label=Amounts and formats
invoiceExport.notes.4.text=Amounts are in the invoice's own currency (the number format shows the ISO code), quantities carry four decimal places, tax rates are plain numbers (19 = 19 %), dates use the DD.MM.YYYY format.
invoiceExport.notes.5.label=Limits
invoiceExport.notes.5.text=Rows per sheet and characters per cell are capped (see XLS-1); a truncated text ends with "…[shortened]".
invoiceExport.notes.6.label=Credit note
invoiceExport.notes.6.text=A credit note document (type 384) appears as its own row with negative amounts and references its original document.
invoiceExport.privacy.1.article=GDPR Art. 4(1)
invoiceExport.privacy.1.text=This export contains personal data (names, addresses, e-mail addresses, VAT identification numbers and bank details of contacts and signatories).
invoiceExport.privacy.2.article=GDPR Art. 4(7)
invoiceExport.privacy.2.text=The operating company is the controller; whoever passes the file on remains responsible for it.
invoiceExport.privacy.3.article=GDPR Art. 5(1)(b), (c), (e), (f)
invoiceExport.privacy.3.text=Purpose limitation, data minimisation, storage limitation, integrity and confidentiality: use the file only for the purpose it was exported for, delete it once that purpose is fulfilled, and keep it access-restricted.
invoiceExport.privacy.4.article=GDPR Art. 6(1)(b) and (c)
invoiceExport.privacy.4.text=The legal basis is contract performance and legal obligations (VAT invoicing obligations and statutory retention duties under German tax law); any further purpose needs its own legal basis.
invoiceExport.privacy.5.article=GDPR Art. 28
invoiceExport.privacy.5.text=Passing the file to a service provider requires a data-processing agreement.
invoiceExport.privacy.6.article=GDPR Art. 32
invoiceExport.privacy.6.text=Security of processing: store encrypted or access-restricted, never send by unencrypted e-mail, never place on a shared drive without access control.
invoiceExport.privacy.7.article=GDPR Art. 17
invoiceExport.privacy.7.text=Erasure: the file is a copy and not subject to the retention duty; the originals remain in the application under the statutory retention duties. Delete the copy after use.

