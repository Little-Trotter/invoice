# German locale by default, English as backup (PO decision 2026-09-02): enables JUnit 5 extension autodetection so
# de.littletrotter.test.GermanDefaultLocaleExtension (registered via
# META-INF/services/org.junit.jupiter.api.extension.Extension) pins Locale.setDefault(GERMANY)
# for every test class in this module without requiring an explicit @ExtendWith on each one.
junit.jupiter.extensions.autodetection.enabled=true
# The mere presence of this file overrides Quarkus's bundled JUnit defaults, which silently
# drops the class orderer QuarkusTest needs and hard-fails the whole module's test bootstrap
# ("corrupted application" guard) — so the orderer Quarkus would otherwise set is restated here.
junit.jupiter.testclass.order.default=io.quarkus.test.junit.util.QuarkusTestProfileAwareClassOrderer
