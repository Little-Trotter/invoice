# Static read-only server for the generated arc42 site (html/). No upstreams,
# no rewriting — it only hands out the files the builder produced.

server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    charset utf-8;

    root /srv/docs;
    index index.html arc42-docs.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
