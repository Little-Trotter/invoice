# Static read-only server for the arc42 site baked into the docs image (Dockerfile.docs).
# Mirrors nginx-docs.conf (used by the local bind-mount compose service) but is rooted at
# nginx's default docroot, since Dockerfile.docs COPYs html/ there instead of bind-mounting
# it at /srv/docs.

server {
    # Both families explicitly: this file replaces the nginx image's own default.conf, so
    # the image's entrypoint script that normally adds the IPv6 listener on top of the
    # packaged template skips it here ("differs from the packaged version") — without this
    # line the container only listens on IPv4, and any client whose "localhost" resolves to
    # ::1 first (e.g. busybox wget in Dockerfile.docs's HEALTHCHECK) gets connection refused.
    listen 80;
    listen [::]:80;
    server_name localhost;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html arc42-docs.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
