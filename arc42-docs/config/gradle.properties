# Gradle configuration for docToolchain
# Prevent parallel builds and cache conflicts in Docker environment

org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.configureondemand=false
org.gradle.caching=false
org.gradle.workers.max=1

# Use unique Gradle user home to avoid cache conflicts
org.gradle.user.home=/tmp/gradle-home

# JVM settings for Docker environment
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=256m -Djava.security.egd=file:/dev/./urandom -Dfile.encoding=UTF-8 -Dgradle.user.home=/tmp/gradle-home

# Skip file system watching which causes issues in Docker
org.gradle.vfs.watch=false

# Disable build scan and welcome message
org.gradle.welcome=never
