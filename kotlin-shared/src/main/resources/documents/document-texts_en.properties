# English text bundle for document content composed by the system (IN-3, IN-4).
#
# This bundle contains system-generated sentences that appear in invoices: the reference
# to a cancelled invoice on a storno document (BT-22) and payment term descriptions (BT-20).
# These are DOCUMENT CONTENT, partly persisted at storno time — not the user's language
# (i18n/messages*.properties in kotlin-invoice) and not the print image's labels
# (reports/invoice-labels_*.properties in kotlin-xpdf).
#
# Rules:
#   - Every key exists in BOTH document-texts_de.properties and document-texts_en.properties.
#     A missing key is a defect, not a fallback — a half-translated document is the failure
#     this programme exists to prevent.
#   - Character encoding is UTF-8 (explicit reader), no escaping of umlauts.

# ── Storno reference ──
# Composed at storno time and persisted into BT-22 (free text), not derived at render time.
# The sentence must reach the PDF, the XML export and the archive package identically.
storno.reference=Reversal of invoice {0} dated {1}.
storno.reference.noDate=Reversal of invoice {0}.
# User's reason text, carried verbatim — never translated, reformatted or truncated.
storno.reason=Reason: {0}

# ── Payment terms ──
# IN-4, PO decisions of 06.09.2026: the chosen PaymentTerm's OWN reference-data name (resolved
# per document language, EN-missing falls back to DE) is the payment-terms text whenever an
# invoice actually has one — these three sentences are the fallback for the one remaining case,
# an invoice with NO payment term at all. Used identically by BT-20 (wire) and the printed
# payment line (PDF) — one text, not two. Decision 3 (06.09.2026): "net" keeps the PDF's
# pre-existing German wording (no "von"); the wire follows the print image, not the other way
# round. Formatting (date, day count) is done by the caller; {0} receives the already-formatted
# value.
paymentTerms.net=Payable within {0} days net
paymentTerms.dueBy=Payable by {0}
paymentTerms.immediate=Payable immediately
# The printed term name is a short snapshot (e.g. "Net 14 days"); the calendar date is
# appended so the reader gets the concrete target, not just the rule that produced it.
paymentTerms.dueOn=due on {0}
# Second payment-block line, only when the invoice carries a computed cash discount (Skonto):
# {0} deadline, {1} rate, {2} discount amount, {3} payable amount, all pre-formatted by the caller.
paymentTerms.cashDiscount=If paid by {0}: {1} discount ({2}), payable {3}

# Notice for private customers on craft-trade invoices; used when the sender maintains no own text.
consumerNote.default=Please keep this invoice for two years. You can state the labour, machine and travel costs it contains in your tax return.
