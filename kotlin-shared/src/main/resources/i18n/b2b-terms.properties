b2b.catalog.bt74.definition=Bereits über „Leistungszeitraum bis'' geführt.
b2b.catalog.bt84.definition=Bereits über die IBAN des Anbieters geführt.
# task12-b2b/T4 — die beiden nachgezogenen freien Kopf-Terms (V916).
