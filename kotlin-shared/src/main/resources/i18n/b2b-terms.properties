b2b.term.bt34.name=Elektronische Adresse des Rechnungsausstellers (Seller electronic address)
b2b.term.bt43.name=E-Mail-Adresse des Rechnungsausstellers (Seller contact email address)
b2b.term.bt44.name=Rechnungsempfänger-Name (Buyer name)
b2b.term.bt46.name=Rechnungsempfänger-Kennung (Buyer identifier)
b2b.term.bt48.name=USt-IdNr. des Rechnungsempfängers (Buyer VAT identifier)
b2b.term.bt49.name=Elektronische Adresse des Rechnungsempfängers (Buyer electronic address)
b2b.term.bt129.name=Menge (Invoiced quantity)
b2b.term.bt130.name=Mengeneinheit (Invoiced quantity unit of measure code)
