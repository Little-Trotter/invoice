b2b.term.bt5.name=Rechnungswährung (Invoice currency code)

# task12-b2b/T1 — read-only ZUGFeRD-/EN-16931-Definitionen der Katalog-Terme, angezeigt im
# Feld-Dialog des B2B-Profils, sobald ein Term ausgewählt ist (nicht der anwenderdefinierte Text).
# BTE-2 — trimmed to the definition sentence alone; the code+name prefix now lives in the
# b2b.term.btNN.name keys above (shown separately as the picker label).
b2b.catalog.bt19.definition=Interne Kontierungs-/Buchungsreferenz des Rechnungsempfängers für diese Rechnung.
