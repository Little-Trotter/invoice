# BTE-9 — German business-term texts of the B2bTerm taxonomy (kotlin-shared), split out of
# kotlin-invoice's messages.properties so every module that depends on kotlin-shared can resolve
# term names/definitions via B2bTermTexts (BTE-9). This base
# bundle is the German one (the project has no messages_de variant — German IS the base bundle,
# same convention as i18n/messages.properties).
#
# b2b.term.btNN.name — short display name next to the code (curated subset only; terms without a
#   curated German name fall back to the official English name in b2b-terms_en.properties).
# b2b.catalog.btNN.definition — spec definition text shown in the profile field dialog.
# BTE-2 — short display name next to the code in the field-editor term picker (label =
# officialCode + this name); split off the combined code+name+definition string the former
# b2b_field_catalog.spec_definition_key value carried (BTE-2). English
# counterpart in messages_en.properties (H27 conventions §1 — new i18n values mirrored to every
# bundle).
b2b.term.bt19.name=Buchungsreferenz des Rechnungsempfängers
b2b.term.bt56.name=Kontaktstelle des Rechnungsempfängers
b2b.term.bt58.name=E-Mail-Adresse der Kontaktstelle des Rechnungsempfängers
b2b.term.bt134.name=Abrechnungszeitraum Beginn (Position)
b2b.term.bt135.name=Abrechnungszeitraum Ende (Position)
b2b.term.bt72.name=Liefer-/Leistungsdatum
b2b.term.bt155.name=Artikelnummer des Rechnungsausstellers (Item Seller''s identifier)
b2b.term.bt156.name=Artikelnummer des Rechnungsempfängers (Item Buyer''s identifier)
b2b.term.bt13.name=Bestellreferenz (Purchase order reference)
b2b.term.bt73.name=Abrechnungszeitraum Beginn (Rechnungskopf)
b2b.term.bt74.name=Abrechnungszeitraum Ende (Rechnungskopf)
b2b.term.bt84.name=Zahlungskontokennung (IBAN)
b2b.term.bt12.name=Vertragsreferenz (Contract reference)
b2b.term.bt18.name=Belegobjekt-Kennung (Invoiced object identifier)
b2b.term.bt11.name=Projektreferenz (Project reference)

