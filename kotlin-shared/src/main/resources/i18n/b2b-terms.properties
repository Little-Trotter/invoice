b2b.catalog.bt156.definition=Artikelkennung, die der Rechnungsempfänger für diese Position führt.
b2b.catalog.bt13.definition=Bereits über das Feld „Rechnungsempfänger-Referenz'' geführt; ein B2B-Profil kann diesen Term nur als Pflicht/optional markieren, kein zweites Eingabefeld.
