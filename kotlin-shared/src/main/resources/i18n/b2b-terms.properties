b2b.catalog.bt18.definition=Kennung des abgerechneten Objekts, z. B. eine Immobilie oder ein Projektgegenstand.
# NEKAR-T2 — bereits über das Feld „Projektnummer'' der Rechnung geführt; ein B2B-Profil kann
# diesen Term nur als Pflicht/optional markieren, kein zweites Eingabefeld.
b2b.catalog.bt11.definition=Bereits über das Feld „Projektnummer'' geführt.

