b2b.catalog.bt58.definition=E-Mail-Adresse, unter der die Kontaktstelle beim Rechnungsempfänger erreichbar ist.
b2b.catalog.bt134.definition=Bereits über „Leistungszeitraum von'' der Position geführt.
b2b.catalog.bt135.definition=Bereits über „Leistungszeitraum bis'' der Position geführt.
